<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VoteAmerica+ Landing Page Variations</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #FAF8F5; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .container { max-width: 600px; width: 100%; }
  .logo { height: 24px; margin-bottom: 48px; }
  h1 { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 8px; }
  p { font-size: 15px; color: #5C5A54; margin-bottom: 40px; }
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1.5px solid #EEECE8; border-radius: 10px; padding: 20px 24px; text-decoration: none; color: inherit; transition: border-color 0.15s, box-shadow 0.15s; }
  .card:hover { border-color: #C8102E; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  .card-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #C8102E; margin-bottom: 4px; }
  .card-title { font-size: 16px; font-weight: 500; }
  .arrow { font-size: 20px; color: #C8102E; }
</style>
</head>
<body>
<div class="container">
  <img src="./assets/logo.svg" alt="VoteAmerica" class="logo"/>
  <h1>Landing Page Variations</h1>
  <p>Please review each variation below and share your feedback.</p>
  <div class="cards">
    <a href="./variation-a.html" class="card">
      <div>
        <div class="card-label">Variation A</div>
        <div class="card-title">Landing Page — Option A</div>
      </div>
      <span class="arrow">→</span>
    </a>
    <a href="./variation-b.html" class="card">
      <div>
        <div class="card-label">Variation B</div>
        <div class="card-title">Landing Page — Option B</div>
      </div>
      <span class="arrow">→</span>
    </a>
    <a href="./variation-c.html" class="card">
      <div>
        <div class="card-label">Variation C</div>
        <div class="card-title">Landing Page — v4</div>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
</div>
</body>
</html>
