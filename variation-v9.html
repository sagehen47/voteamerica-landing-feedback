/* ── Rotating word ── */
const WORDS = ['campaigns.','nonprofits.','employers.','educators.','newsrooms.','civic groups.'];
function RotatingWord() {
  const [idx, setIdx] = React.useState(0);
  const [phase, setPhase] = React.useState('in');
  React.useEffect(() => {
    const t = setInterval(() => {
      setPhase('out');
      setTimeout(() => { setIdx(i => (i+1) % WORDS.length); setPhase('in'); }, 300);
    }, 2600);
    return () => clearInterval(t);
  }, []);
  return <span className={`inline-block text-va-red min-w-[200px] md:min-w-[400px] text-left word-${phase}`} style={{verticalAlign:'bottom',overflow:'visible',paddingBottom:'0.1em'}}>{WORDS[idx]}</span>;
}

/* ── Logos ── */
function PartnerLogo({partner, visible, idx}) {
  // Try to render the image; on error, fall back to styled wordmark
  const [imgFailed, setImgFailed] = React.useState(false);
  const showImg = partner.file && !imgFailed;
  const style = {'--brand': partner.color, opacity: visible ? 1 : 0, animationDelay: `${idx * 60}ms`, animationPlayState: visible ? 'running' : 'paused'};
  if (showImg) {
    // Icon-only logos (no embedded company name) get a caption below
    if (partner.showLabel) {
      return (
        <div className="partner-grouped logo-animate flex flex-col items-center gap-2" style={style}>
          <img
            src={`./assets/partners/${partner.file}`}
            alt={partner.name}
            onError={() => setImgFailed(true)}
            className="partner-img-icon"
          />
          <span className="partner-caption text-[13px] font-medium text-neutral-500 whitespace-nowrap">{partner.name}</span>
        </div>
      );
    }
    return (
      <img
        src={`./assets/partners/${partner.file}`}
        alt={partner.name}
        onError={() => setImgFailed(true)}
        className="partner-img logo-animate"
        style={style}
      />
    );
  }
  return (
    <div
      className="partner-logo logo-animate text-base md:text-lg font-semibold tracking-tight whitespace-nowrap text-neutral-400 transition-colors duration-200 cursor-default"
      style={style}
    >{partner.name}</div>
  );
}

function Logos() {
  // showLabel=true for partners whose logo file is just an icon/mark with no embedded company name
  const partners = [
    {name:'Action Network',  color:'#EF4135', file: 'action-network.svg',  showLabel: true},
    {name:'EveryAction',     color:'#005CA9', file: 'everyaction.webp', showLabel: true},
    {name:'NGP VAN',         color:'#0066A1', file: 'ngp-van.png',         showLabel: false},
    {name:'CTA Hopper',      color:'#1A1A1A', file: 'cta-hopper.webp',     showLabel: false},
    {name:'DDx',             color:'#1A1A1A', file: 'ddx.webp',             showLabel: false},
    {name:'TMC',             color:'#1A1A1A', file: 'tmc.png',             showLabel: false},
    {name:'AWS Redshift',    color:'#FF9900', file: 'aws-redshift.svg',    showLabel: true},
    {name:'Google BigQuery', color:'#4285F4', file: 'google-bigquery.webp', showLabel: true},
  ];
  const ref = React.useRef();
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } }, {threshold: 0.2});
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div className="py-12 md:py-14 bg-white border-y border-neutral-100" ref={ref}>
      <div className="max-w-[1100px] mx-auto px-4 md:px-16">
        <div className="text-center text-[11px] text-neutral-400 uppercase tracking-widest font-medium mb-8">Integrates with</div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-y-8 gap-x-8 md:gap-x-12 items-center justify-items-center">
          {partners.map((p, i) => (
            <PartnerLogo key={p.name} partner={p} visible={visible} idx={i}/>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── Stats ── */
function Counter({target}) {
  const isRange = /[–\-]/.test(target.replace(/^[^0-9]*/,'').replace(/[^0-9.]+$/,''));
  const [val, setVal] = React.useState(isRange ? null : 0);
  const ref = React.useRef();
  React.useEffect(() => {
    if (isRange) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        obs.disconnect();
        const num = parseFloat(target.replace(/[^0-9.]/g,''));
        const dur = 1200; const start = performance.now();
        const tick = now => { const p=Math.min((now-start)/dur,1); const ease=1-Math.pow(1-p,3); setVal(Math.round(num*ease)); if(p<1) requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
      }
    },{threshold:0.5});
    if (ref.current) obs.observe(ref.current);
    return ()=>obs.disconnect();
  },[target,isRange]);
  if (isRange) return <span ref={ref}>{target}</span>;
  const pfx = target.match(/^[^0-9]*/)?.[0]||'';
  const sfx = target.match(/[^0-9.]+$/)?.[0]||'';
  return <span ref={ref}>{pfx}{val}{sfx}</span>;
}

        <div>
          <h2 className="text-[26px] md:text-[36px] font-medium tracking-tight leading-tight mb-3">Built for democracy, not for profit.</h2>
          <p className="text-[15px] md:text-[17px] text-neutral-600 leading-relaxed">VoteAmerica is a 501(c)(3) nonprofit. Every dollar from VoteAmerica Plus funds nonpartisan voter mobilization.</p>
