/* ── Nav: sticky + frosted glass on scroll ── */
function Nav({onCta}) {
  const [scrolled, setScrolled] = React.useState(false);
  React.useEffect(() => {
    const h = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', h);
    return () => window.removeEventListener('scroll', h);
  }, []);
  return (
    <nav className={`fixed top-0 left-0 right-0 z-50 flex items-center gap-5 px-24 py-4 transition-all duration-300 ${scrolled ? 'bg-va-cream/90 backdrop-blur-xl border-b border-neutral-100' : ''}`}>

      <div className="hidden md:flex gap-6 ml-4">
        {['How it works','Who it\'s for','Pricing','FAQ'].map(l => (
          <a key={l} href={'#'+l.toLowerCase().replace(/[^a-z]/g,'-')} className="text-[13px] text-neutral-600 hover:text-black transition-colors cursor-pointer">{l}</a>

/* ── Rotating word ── */
const WORDS = ['campaigns.','nonprofits.','employers.','newsrooms.','civic groups.'];
function RotatingWord() {
  const [idx, setIdx] = React.useState(0);
  const [phase, setPhase] = React.useState('in');
  React.useEffect(() => {
    const t = setInterval(() => {
      setPhase('out');
      setTimeout(() => { setIdx(i => (i+1) % WORDS.length); setPhase('in'); }, 300);
    }, 2600);
    return () => clearInterval(t);
  }, []);
  return <span className={`inline-block text-va-red min-w-[280px] md:min-w-[400px] text-left word-${phase}`} style={{verticalAlign:'bottom',overflow:'visible',paddingBottom:'0.1em'}}>{WORDS[idx]}</span>;
}

/* ── Logos ── */
function Logos() {
  const orgs = ['Everytown','Gusto','Credit Karma','Change.org','GLAAD','The 19th','Patagonia','Hinge'];
  const ref = React.useRef();
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } }, {threshold: 0.2});
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div className="py-10 bg-white border-y border-neutral-100" ref={ref}>
      <div className="max-w-[1100px] mx-auto px-16">
        <div className="text-center text-[11px] text-neutral-400 uppercase tracking-widest font-medium mb-5">Trusted by 500+ organizations</div>
        <div className="flex justify-center gap-2 flex-wrap">
          {orgs.map((o, i) => (
            <div key={o}
              className={`px-5 py-2.5 bg-va-cream border border-neutral-100 rounded-lg text-sm font-medium text-black hover:border-va-red transition-colors logo-animate`}
              style={{opacity: visible ? 1 : 0, animationDelay: `${i * 60}ms`, animationPlayState: visible ? 'running' : 'paused'}}
            >{o}</div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── Stats ── */
function Counter({target}) {
  const [val, setVal] = React.useState(0);
  const ref = React.useRef();
  React.useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        obs.disconnect();
        const num = parseFloat(target.replace(/[^0-9.]/g,''));
        const dur = 1200; const start = performance.now();
        const tick = now => { const p=Math.min((now-start)/dur,1); const ease=1-Math.pow(1-p,3); setVal(Math.round(num*ease)); if(p<1) requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
      }
    },{threshold:0.5});
    if (ref.current) obs.observe(ref.current);
    return ()=>obs.disconnect();
  },[target]);
  const pfx = target.match(/^[^0-9]*/)?.[0]||'';
  const sfx = target.match(/[^0-9.]+$/)?.[0]||'';
  return <span ref={ref}>{pfx}{val}{sfx}</span>;
}
