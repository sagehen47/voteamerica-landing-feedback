<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VoteAmerica Plus | Variation B</title>
<link rel="icon" href="./assets/logomark.svg"/>
<style>
@import url("./styles/tokens.css");
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);background:#FAF8F5;color:#000;-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.shell{max-width:1100px;margin:0 auto;padding:0 40px}

/* ── NAV ── */
.nav{display:flex;align-items:center;gap:20px;padding:20px 40px;max-width:1100px;margin:0 auto;border-bottom:1px solid #EEECE8}
.nav-brand{display:flex;align-items:center}
.nav-brand img{height:22px}
.nav-brand-plus{font-size:14px;font-weight:500;color:#C8102E;margin-left:4px}
.nav-sp{flex:1}
.nav-links{display:flex;gap:24px}
.nav-links a{font-size:14px;color:#5C5A54;cursor:pointer;transition:color .15s}
.nav-links a:hover{color:#000}
.btn-r{background:#C8102E;color:#fff;padding:10px 20px;border-radius:6px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .15s;white-space:nowrap}
.btn-r:hover{background:#9B0C22}
.btn-r.lg{padding:15px 26px;font-size:16px}
.btn-o{background:transparent;color:#000;border:1.5px solid #D8D5CE;padding:10px 20px;border-radius:6px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s}
.btn-o:hover{border-color:#000}
.btn-o.lg{padding:15px 26px;font-size:16px}

/* ── HERO — full viewport, rotating word ── */
.hero{min-height:100vh;display:grid;grid-template-columns:1fr 380px;gap:56px;align-items:center;padding:100px 40px 80px;max-width:1100px;margin:0 auto}
.hero-left{position:relative}
.hero-pre{font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#5C5A54;margin-bottom:24px}
.hero h1{font-size:clamp(44px,6.5vw,88px);font-weight:500;line-height:1.02;letter-spacing:-.035em;color:#000;margin-bottom:0}
.hero h1 .word-swap{display:inline-block;color:#C8102E;min-width:420px;vertical-align:bottom;overflow:visible;padding-bottom:0.1em}
.word-out{animation:wordOut .35s forwards}
.word-in{animation:wordIn .35s forwards}
@keyframes wordOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-20px)}}
@keyframes wordIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.hero-sub{font-size:19px;color:#5C5A54;max-width:560px;line-height:1.55;margin-top:28px;margin-bottom:36px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.hero-proof{display:flex;gap:24px;flex-wrap:wrap;font-size:13px;color:#5C5A54;padding-top:20px;border-top:1px solid #EEECE8}
.hero-proof strong{color:#000;font-weight:500}

/* Hero right decoration */
.hero-deco{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-self:center}
.deco-card{background:#fff;border:1px solid #EEECE8;border-radius:10px;padding:20px 18px}
.deco-card-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#9E9B93;font-weight:500;margin-bottom:6px}
.deco-card-val{font-size:28px;font-weight:500;color:#C8102E;letter-spacing:-.02em;line-height:1}
.deco-card-sub{font-size:12px;color:#9E9B93;margin-top:4px}

/* ── LOGOS ── */
.logos{padding:44px 0;background:#fff;border-top:1px solid #EEECE8;border-bottom:1px solid #EEECE8}
.logos-lbl{text-align:center;font-size:11px;color:#9E9B93;letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px}
.logos-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.lpill{padding:11px 20px;border:1px solid #EEECE8;border-radius:8px;font-size:14px;font-weight:500;color:#000;background:#FAF8F5;transition:border-color .15s,background .15s}
.lpill:hover{border-color:#C8102E;background:#fff}

/* ── HOW IT WORKS — step-through ── */
.how{padding:100px 0;background:#fff;border-bottom:1px solid #EEECE8}
.how-layout{display:grid;grid-template-columns:1fr 1.2fr;gap:80px;align-items:start}
.how-sticky{position:sticky;top:100px}
.how-sticky h2{font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:1.08;margin-bottom:16px}
.how-sticky p{font-size:17px;color:#5C5A54;line-height:1.55;margin-bottom:32px}
.how-steps{display:flex;flex-direction:column;gap:0}
.how-item{padding:24px 0;border-top:1px solid #EEECE8;cursor:pointer;transition:padding .2s}
.how-item:last-child{border-bottom:1px solid #EEECE8}
.how-item.active{padding:28px 0}
.how-item-head{display:flex;align-items:center;gap:16px}
.how-item-n{width:32px;height:32px;border-radius:50%;background:#EEECE8;color:#5C5A54;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,color .2s}
.how-item.active .how-item-n{background:#C8102E;color:#fff}
.how-item-title{font-size:17px;font-weight:500;color:#000}
.how-item-body{display:none;padding:14px 0 0 48px;font-size:15px;color:#5C5A54;line-height:1.6}
.how-item.active .how-item-body{display:block}
/* right visual */
.how-visual{position:sticky;top:100px;background:#FAF8F5;border:1px solid #EEECE8;border-radius:14px;padding:36px;min-height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transition:all .3s}
.how-visual-n{font-size:120px;font-weight:500;color:#EEECE8;line-height:1;letter-spacing:-.04em;margin-bottom:12px}
.how-visual-h{font-size:22px;font-weight:500;color:#000;letter-spacing:-.01em}
.how-visual-p{font-size:15px;color:#5C5A54;margin-top:8px;max-width:260px}

/* ── STEP GRAPHICS ── */
.sg{background:#FAF8F5;border:1px solid #EEECE8;border-radius:12px;padding:28px;min-height:280px;display:flex;flex-direction:column;justify-content:center;transition:all .35s ease}
.sg-code{font-family:monospace;font-size:12px;background:#1a1a2e;color:#e2e8f0;border-radius:8px;padding:16px;line-height:1.7}
.sg-code .ck{color:#C8102E}.sg-code .cs{color:#86efac}.sg-code .ca{color:#93c5fd}
.sg-form{background:#fff;border:1px solid #EEECE8;border-radius:8px;padding:20px}
.sg-form-label{font-size:11px;font-weight:500;color:#5C5A54;margin-bottom:6px}
.sg-form-input{width:100%;padding:10px 12px;border:1.5px solid #EEECE8;border-radius:6px;font-size:14px;color:#000;margin-bottom:12px;background:#FAF8F5}
.sg-form-btn{width:100%;background:#C8102E;color:#fff;padding:11px;border-radius:6px;font-size:14px;font-weight:500;text-align:center}
.sg-notif{background:#fff;border:1px solid #EEECE8;border-radius:10px;padding:16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.sg-notif-icon{width:36px;height:36px;border-radius:8px;background:#FEE2E2;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.sg-notif-title{font-size:13px;font-weight:500;color:#000;margin-bottom:2px}
.sg-notif-sub{font-size:12px;color:#5C5A54}
.sg-badge{display:inline-block;background:#EEECE8;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:500;color:#5C5A54;margin-top:8px}

/* ── WHO ACCORDION ── */
.who{padding:100px 0;border-bottom:1px solid #EEECE8;background:#000;overflow:hidden}
.who h2{font-size:40px;font-weight:500;letter-spacing:-.02em;margin-bottom:14px;color:#fff}
.who-sub{font-size:17px;color:rgba(255,255,255,.6);margin-bottom:48px;max-width:480px}
.who-accord{border-top:1px solid rgba(255,255,255,.12)}
.wa-item{border-bottom:1px solid rgba(255,255,255,.12);cursor:pointer;transition:background .2s}
.wa-item:hover{background:rgba(255,255,255,.03)}
.wa-item.open{background:rgba(255,255,255,.04)}
.wa-head{display:flex;align-items:center;gap:24px;padding:28px 0;user-select:none}
.wa-num{font-size:13px;font-weight:500;color:#C8102E;min-width:32px;flex-shrink:0}
.wa-title{font-size:clamp(24px,3.5vw,44px);font-weight:500;color:rgba(255,255,255,.45);line-height:1.05;letter-spacing:-.02em;flex:1;transition:color .25s}
.wa-item.open .wa-title{color:#fff}
.wa-arrow{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,transform .3s}
.wa-item.open .wa-arrow{background:#C8102E;border-color:#C8102E;transform:rotate(45deg)}
.wa-body{display:none;padding:0 0 32px 56px}
.wa-item.open .wa-body{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.wa-lede{font-size:17px;color:rgba(255,255,255,.7);line-height:1.6;margin-bottom:20px}
.wa-cta{background:#C8102E;color:#fff;padding:12px 20px;border-radius:6px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .15s;border:none;cursor:pointer}
.wa-cta:hover{background:#9B0C22}
.wa-facts{list-style:none;padding:0}
.wa-fact{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;color:rgba(255,255,255,.7);line-height:1.45}
.wa-fact:first-child{border-top:1px solid rgba(255,255,255,.08)}
.wa-dot{width:14px;height:14px;border-radius:50%;background:#C8102E;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}

/* ── PRICING ── */
.pricing{padding:100px 0;background:#fff;border-bottom:1px solid #EEECE8}
.pricing h2{font-size:40px;font-weight:500;letter-spacing:-.02em;margin-bottom:14px}
.pricing-sub{font-size:17px;color:#5C5A54;margin-bottom:44px;max-width:500px}
.pricing-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pcard{border-radius:14px;padding:44px;border:1px solid #EEECE8;transition:box-shadow .2s,transform .2s}
.pcard:hover{box-shadow:0 8px 32px rgba(0,0,0,.07);transform:translateY(-2px)}
.pcard.free{background:#FAF8F5}
.pcard.plus{background:#000;color:#fff;border-color:#000}
.pcard-tier{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:500;margin-bottom:14px}
.pcard.free .pcard-tier{color:#9E9B93}
.pcard.plus .pcard-tier{color:rgba(255,255,255,.5)}
.pcard-price{font-size:48px;font-weight:500;letter-spacing:-.03em;line-height:1;margin-bottom:8px}
.pcard.free .pcard-price{color:#000}
.pcard.plus .pcard-price{color:#fff}
.pcard-note{font-size:14px;margin-bottom:28px}
.pcard.free .pcard-note{color:#5C5A54}
.pcard.plus .pcard-note{color:rgba(255,255,255,.55)}
.prows{list-style:none;padding:0;margin-bottom:32px}
.prow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:14px;line-height:1.45;border-bottom:1px solid}
.prow:first-child{border-top:1px solid}
.pcard.free .prow{color:#2E2D2A;border-color:#EEECE8}
.pcard.plus .prow{color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.08)}
.prow-chk{width:16px;height:16px;border-radius:50%;background:#C8102E;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.pricing-note{text-align:center;margin-top:18px;font-size:13px;color:#9E9B93}
.btn-w{background:#fff;color:#000;padding:15px 26px;border-radius:6px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s}
.btn-w:hover{opacity:.88}

/* ── STATS ── */
.stats{padding:80px 0;border-bottom:1px solid #EEECE8}
.stats-inner{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.stats-left h2{font-size:36px;font-weight:500;letter-spacing:-.02em;line-height:1.1;margin-bottom:14px}
.stats-left p{font-size:17px;color:#5C5A54;line-height:1.55}
.stats-right{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #EEECE8;border-radius:12px;overflow:hidden}
.stat-cell{padding:28px 24px;background:#fff}
.stat-cell:nth-child(2),.stat-cell:nth-child(4){border-left:1px solid #EEECE8}
.stat-cell:nth-child(3),.stat-cell:nth-child(4){border-top:1px solid #EEECE8}
.stat-n{font-size:48px;font-weight:500;color:#C8102E;line-height:1;letter-spacing:-.035em}
.stat-l{font-size:13px;color:#5C5A54;margin-top:8px;line-height:1.4}

/* ── FAQ ── */
.faq{padding:100px 0;border-bottom:1px solid #EEECE8}
.faq h2{font-size:36px;font-weight:500;letter-spacing:-.02em;margin-bottom:44px}
.faq-list{max-width:760px;border-top:1px solid #EEECE8}
.fitem{border-bottom:1px solid #EEECE8}
.fq{display:flex;justify-content:space-between;align-items:center;width:100%;padding:20px 0;font-size:16px;font-weight:500;color:#000;text-align:left;gap:16px;cursor:pointer;background:none}
.fq svg{flex-shrink:0;transition:transform .2s;color:#9E9B93}
.fitem.open .fq svg{transform:rotate(45deg);color:#C8102E}
.fa{display:none;padding:0 0 20px;font-size:15px;color:#5C5A54;line-height:1.7;max-width:680px}
.fitem.open .fa{display:block}

/* ── FINAL CTA ── */
.fcta{padding:100px 0;background:#C8102E;text-align:center}
.fcta h2{font-size:clamp(36px,5vw,64px);font-weight:500;letter-spacing:-.03em;line-height:1.04;color:#fff;margin-bottom:14px}
.fcta p{font-size:18px;color:rgba(255,255,255,.75);margin-bottom:32px}
.fcta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.fcta-trust{margin-top:20px;font-size:12px;color:rgba(255,255,255,.55);letter-spacing:.03em}
.btn-fcta-w{background:#fff;color:#C8102E;padding:16px 28px;border-radius:6px;font-size:16px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s}
.btn-fcta-w:hover{opacity:.9}
.btn-fcta-o{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4);padding:15.5px 28px;border-radius:6px;font-size:16px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s}
.btn-fcta-o:hover{border-color:#fff}

/* ── FOOTER ── */
footer{background:#000;padding:48px 0 28px}
.ft-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:32px;padding-bottom:28px;border-bottom:1px solid rgba(255,255,255,.1)}
.ft-brand{display:flex;align-items:center}
.ft-brand img{height:20px;filter:brightness(0) invert(1)}
.ft-brand-plus{font-size:14px;font-weight:500;color:#C8102E;margin-left:4px}
.ft-cols{display:flex;gap:48px;flex-wrap:wrap}
.ft-col h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.3);font-weight:500;margin-bottom:12px}
.ft-col a{display:block;font-size:14px;color:rgba(255,255,255,.6);margin-bottom:8px;cursor:pointer}
.ft-col a:hover{color:#fff}
.ft-bottom{padding-top:20px;font-size:12px;color:rgba(255,255,255,.35);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px)}
.modal-inner{background:#fff;border-radius:14px;padding:36px;max-width:520px;width:100%;position:relative;max-height:90vh;overflow-y:auto}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;cursor:pointer;font-size:18px;color:#9E9B93;line-height:1}
.modal-kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#C8102E;font-weight:500;margin-bottom:12px}
.modal-inner h3{font-size:22px;font-weight:500;color:#000;margin-bottom:20px}

/* ── MOBILE ── */
@media(max-width:768px){
  .nav-links{display:none}
  .hero{padding:80px 24px 60px;min-height:auto}
  .hero h1 .word-swap{min-width:auto}
  .hero-deco{display:none}
  .shell{padding:0 24px}
  .hero{grid-template-columns:1fr}
  .hero-deco{display:none}
  .how-layout{grid-template-columns:1fr}
  .how-sticky,.how-visual{position:static}
  .wa-item.open .wa-body{grid-template-columns:1fr}
  .pricing-grid{grid-template-columns:1fr}
  .stats-inner{grid-template-columns:1fr}
  .stats-right{grid-template-columns:1fr 1fr}
}
</style>

<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">

const Ic = {
  Arr: () => <span style={{marginLeft:3}}>&#8594;</span>,
  Chk: ({s=9,c='#fff'}) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none" stroke={c} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 8 7 12 13 4"/></svg>,
  Pls: ({s=18}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>,
};

/* ── Rotating word hero ── */
const WORDS = ['campaigns.','nonprofits.','employers.','newsrooms.','civic groups.'];

function RotatingWord() {
  const [idx, setIdx] = React.useState(0);
  const [phase, setPhase] = React.useState('in');
  React.useEffect(() => {
    const t = setInterval(() => {
      setPhase('out');
      setTimeout(() => {
        setIdx(i => (i+1) % WORDS.length);
        setPhase('in');
      }, 350);
    }, 2600);
    return () => clearInterval(t);
  }, []);
  return <span className={'word-swap word-'+phase}>{WORDS[idx]}</span>;
}

/* ── Animated counter ── */
function Counter({target}) {
  const [val, setVal] = React.useState(0);
  const ref = React.useRef();
  React.useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        obs.disconnect();
        const raw = target.replace(/[^0-9.]/g,'');
        const num = parseFloat(raw);
        const dur = 1200;
        const start = performance.now();
        const tick = now => {
          const p = Math.min((now-start)/dur,1);
          const ease = 1-Math.pow(1-p,3);
          setVal(Math.round(num*ease));
          if (p<1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    },{threshold:0.5});
    if (ref.current) obs.observe(ref.current);
    return ()=>obs.disconnect();
  },[target]);
  const pfx = target.match(/^[^0-9]*/)?.[0]||'';
  const sfx = target.match(/[^0-9.]+$/)?.[0]||'';
  return <span ref={ref}>{pfx}{val}{sfx}</span>;
}

/* ── Step-through How It Works ── */
const STEPS = [
  {n:'01',h:'Set up in minutes',p:'Simple copy-paste onto your site. No developers needed. White-label it to match your brand in minutes.'},
  {n:'02',h:'Your audience takes action',p:'Visitors register, verify their status, find their polling place, and opt in to election reminders — without leaving your page.'},
  {n:'03',h:'They stay civically engaged',p:'Every person who opts in gets lifetime election reminders. Upgrade to Plus to access full contact records and sync to your CRM.'},
];

function StepGraphic({step}) {
  if (step === 0) return (
    <div className="sg">
      <div style={{fontSize:11,fontWeight:500,color:'#5C5A54',letterSpacing:'.04em',textTransform:'uppercase',marginBottom:12}}>Copy this onto your site</div>
      <div className="sg-code">
        <span className="ck">&lt;script</span> <span className="ca">src</span>=<span className="cs">"cdn.voteamerica.org/embed/tools.js"</span> <span className="ca">async</span><span className="ck">&gt;&lt;/script&gt;</span><br/>
        <span className="ck">&lt;div</span> <span className="ca">class</span>=<span className="cs">"voteamerica-embed"</span><br/>
        &nbsp;&nbsp;&nbsp;&nbsp;<span className="ca">data-tool</span>=<span className="cs">"register"</span><span className="ck">&gt;&lt;/div&gt;</span>
